name: Stage reviewed README artwork
on:
  push:
    branches: [audit/readme-visuals-20260909]
    paths: [.github/workflows/stage-readme-visuals.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c34a81e750b418620c0bb5be148427fd1f68d80
          persist-credentials: false
      - name: Import checked artwork and update only documentation
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,urllib.request
          source='https://raw.githubusercontent.com/lora-sys/loraSys/860950b256c72c32864cd2f247c2f2d8cffd1935/src/assets/projects/'
          assets={
            'lora-v3-project-zhihu-threads-zh.webp':'005d49a036e3b9900a916aea1d6824a7a62ffa19b98297506dc7dad3a96be30b',
            'lora-v3-project-zhihu-threads-en.webp':'129e397fd6fa44b282e847542467dfead9ee7f02fee088b0b81a252394ac109c',
            'lora-v3-zhihu-workflow-zh.webp':'f009d85aa5dfdfd215975804c7fa121a824a0b5a7a37f8d76e96c933ef42ec71',
            'lora-v3-zhihu-workflow-en.webp':'f0148ffb44f1d54bd69f6fc78870c76490e45b5ddcc17c2676add2825361bda4'
          }
          root=Path('assets/readme');root.mkdir(parents=True,exist_ok=True)
          for name,digest in assets.items():
              data=urllib.request.urlopen(source+name,timeout=30).read()
              assert hashlib.sha256(data).hexdigest()==digest,name
              assert data[8:12]==b'WEBP' and len(data)<180000
              (root/name).write_bytes(data)
          manifest={'source':source,'style':'Lora Field Notes','method':'Localized compositions using the existing original Lora and Mochi assets. Illustrations, not product screenshots.','dimensions':[1600,900],'sha256':assets}
          (root/'visuals.json').write_text(json.dumps(manifest,indent=2)+'\n')
          p=Path('README.md');s=p.read_text()
          assert './assets/readme/hero.png' in s and '## 工作方式' in s
          s=s.replace('./assets/readme/hero.png','./assets/readme/lora-v3-project-zhihu-threads-zh.webp',1)
          s=s.replace('alt="Zhihu Threads — 用 AI 把模糊问题变成知乎证据学习线"','alt="Zhihu Threads 项目插画。由用户选择知乎摘录，AI 组织学习线。"',1)
          s=s.replace('# Zhihu Threads\n','# Zhihu Threads\n\n[English](./README.en.md)\n\n封面与流程图沿用 Lora Field Notes 的原创角色和纸张视觉。它们是功能示意，不是产品截图。\n',1)
          s=s.replace('## 工作方式\n','## 工作方式\n\n![来源由用户选择，再生成学习线](./assets/readme/lora-v3-zhihu-workflow-zh.webp)\n',1)
          p.write_text(s)
          Path('README.en.md').write_text('''# Zhihu Threads

          [中文](./README.md)

          ![Zhihu Threads project illustration](./assets/readme/lora-v3-project-zhihu-threads-en.webp)

          Turn a question into a learning thread grounded in selected Zhihu excerpts. The user chooses sources; AI explains candidates and organizes the selected material into learning nodes, follow-up questions and self-tests.

          These illustrations use the existing Lora Field Notes characters and paper-based visual style. They explain the workflow and are not product screenshots.

          ## How it works

          ![The user chooses the evidence before AI builds the learning thread](./assets/readme/lora-v3-zhihu-workflow-en.webp)

          Clarify the learning intent, search for answer or article excerpts, choose the sources, and build a thread. AI does not select sources on the user's behalf. Thread follow-up answers use the current thread's excerpts and retain unknown or evidence_gap states when evidence is insufficient.

          ## Start locally

          ```bash
          pnpm install
          pnpm dev
          ```

          Open the address printed by the development server. Do not assume a fixed port.

          ```bash
          pnpm check
          pnpm test
          pnpm build
          ```

          ## Implementation

          The application uses TanStack Start and TanStack Router, TypeScript, Tailwind CSS, Effect and SQLite through better-sqlite3. The repository includes evaluation datasets, JSON execution traces and a local /evals dashboard. Evaluation counts describe the repository's checks, not guaranteed live-model quality.

          ## Source boundaries

          Use summary-level ContentText returned by the official API. Do not treat an excerpt as a complete article, invent missing article bodies, or present a later source as proof that an earlier author was wrong. Source types and links remain visible. Credentials and private local state must not be committed.

          See the Chinese README for the full project layout and evaluation commands.

          ## License

          MIT
          '''.replace('\n          ','\n'))
          for file in ['README.md','README.en.md']:
              import re
              for target in re.findall(r'(?:src="|\]\()(\./[^"\)]+)',Path(file).read_text()):
                  assert Path(target).exists(),target
          print('Verified four WebP assets and both README image references')
      - name: Push documentation candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c docs/lora-visual-20260909
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md assets/readme/lora-v3-*.webp assets/readme/visuals.json
          git diff --cached --check
          git commit -m 'docs: add consistent bilingual cover and source-selection diagram'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/docs/lora-visual-20260909
          git rev-parse HEAD
