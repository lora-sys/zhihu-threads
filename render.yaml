# Render blueprint: free web service, Docker runtime.
#
# Storage lives in Turso (TURSO_DATABASE_URL), so the service needs no disk and
# survives Render's spin-down. PORT is injected by Render and the container
# already binds to ${PORT:-3000}.
services:
  - type: web
    name: zhihu-threads
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ZHIHU_ACCESS_SECRET
        sync: false
      - key: ZHIHU_OAUTH_APP_ID
        sync: false
      - key: ZHIHU_OAUTH_APP_KEY
        sync: false
      - key: ZHIHU_OAUTH_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
